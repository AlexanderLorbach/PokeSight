# Pokémon Heartfelt Gold (NDS): ROM hack of HeartGold (US) by Trinsic64, built with hg-engine; English only.
# https://pokehackdex.com/romhacks/pokemon-heartfelt-gold/ - https://github.com/Trinsic64/Heart-Gold-Retiled
name: Pokémon Heartfelt Gold
ruleset: heartfelt-gold  # generated from the hack's sources (tools/GenerateHgEngineRuleset.java): Gen 9 + Fairy
languages: [EN]
# Downloaded on first start into %LOCALAPPDATA%\PokeSight\sprites (© Nintendo, so not shipped); pinned commit.
# The game's own sprites: hg-engine's DS-style sprites of all generations (pinned commit, as the ruleset's source).
spriteUrl: "https://raw.githubusercontent.com/BluRosie/hg-engine/61b510cfb6cf7d77c3b083150fad3499f82fd326/data/graphics/sprites/{name}/male/front.png"
spriteSheets: true       # two 80x80 frames per file, palette colour 0 = background
capitalNames: false      # the hack's Species.c has mixed-case names ("Bulbasaur", cut to 10 letters: "ScreamTail")
