# Pokémon Let's Go, Pikachu! / Eevee! (Switch)
name: "Pokémon Let's Go, Pikachu! / Eevee!"
ruleset: lets-go
languages: [EN, DE]
# Downloaded on first start into %LOCALAPPDATA%\PokeSight\sprites (© Nintendo, so not shipped); pinned commit.
# PokeAPI has no PNG sprites of this game (only GIF/WebP, which JavaFX cannot show), so the default sprites are used.
spriteUrl: "https://raw.githubusercontent.com/PokeAPI/sprites/7a7d66b1620e646f69afd48dc1273da9033ede9c/sprites/pokemon/{name}.png"
capitalNames: false      # names in mixed case ("Gengar") since Gen 5
