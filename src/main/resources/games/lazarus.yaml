# Pokémon Lazarus (GBA): ROM hack of Emerald (US) by Nemo622 (v2.0), Ilios region, built on pokeemerald-expansion with
# its default (Gen 9) data; GBC-style graphics. Binary-only hack: data from its documentation. English only.
# https://ko-fi.com/nemo622 (developer) - https://pokemonlazarus.net (community site: changelog, documentation)
name: Pokémon Lazarus
ruleset: lazarus         # generated from the documentation (tools/GenerateLazarusRuleset.java)
languages: [EN]
# Downloaded on first start into %LOCALAPPDATA%\PokeSight\sprites (© Nintendo, so not shipped); pinned commit.
# Lazarus's own GBC-style sprites are not published: the default PokeAPI sprites (all 1025 + forms).
spriteUrl: "https://raw.githubusercontent.com/PokeAPI/sprites/7a7d66b1620e646f69afd48dc1273da9033ede9c/sprites/pokemon/{name}.png"
capitalNames: false      # battle boxes show "Tentacool♂ Lv23" (mixed case)
